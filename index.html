<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@200..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="design flex-center">
    <div class="flex-center container">
          <div class="left flex-center">
            <h4 class="pale-grey ur">Your Result</h4>
            <div class="result-circle">
              <span class="result">76</span>
              <span class="of-100 pale-grey">of 100</span>
            </div>
            <div  style="display: flex; align-items: center; flex-direction: column;">
              <h3>Great</h3>
              <p> You scored higher than 65% of the people who have taken these tests.</p>
            </div>
            
          </div>
          <div class="right flex-center">
            <h4>Summary</h4>
            <div style="width: 100%;" class="category-container">
              <div class="category c1"><p><img src="assets/images/icon-reaction.svg" alt="">Reaction</p><p>80 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c2"><p><img src="assets/images/icon-memory.svg" alt="">Memory</p><p>92 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c3"><p><img src="assets/images/icon-verbal.svg" alt="">Verbal</p><p>61 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c4"><p><img src="assets/images/icon-visual.svg" alt="">Visual</p><p>72 <span class="pale-grey">/ 100</span></p></div>
            </div>
            
            <a href="">Continue</a>
          </div>
      </div>
  </div>
  
</body>
</html>
