<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <div class="design flex-center">
    <div class="flex-center container">
          <div class="left flex-center">
            <h4 class="pale-grey ur">Your Result</h4>
            <div class="result-circle">
              <span class="result">76</span>
              <span class="of-100 pale-grey">of 100</span>
            </div>
            <div  style="display: flex; align-items: center; flex-direction: column;">
              <h3>Great</h3>
              <p> You scored higher than 65% of the people who have taken these tests.</p>
            </div>
            
          </div>
          <div class="right flex-center">
            <h4>Summary</h4>
            <div style="width: 100%;" class="category-container">
              <div class="category c1"><p><img src="assets/images/icon-reaction.svg" alt="">Reaction</p><p>80 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c2"><p><img src="assets/images/icon-memory.svg" alt="">Memory</p><p>92 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c3"><p><img src="assets/images/icon-verbal.svg" alt="">Verbal</p><p>61 <span class="pale-grey">/ 100</span></p></div>
            <div class="category c4"><p><img src="assets/images/icon-visual.svg" alt="">Visual</p><p>72 <span class="pale-grey">/ 100</span></p></div>
            </div>
            
            <a href="">Continue</a>
          </div>
      </div>
  </div>
  
</body>
</html>
